services:
  - type: web
    name: fios-api-gateway
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fios-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: https://web-khaki-beta-57.vercel.app,http://localhost:3000
      - key: REDIS_HOST
        value: localhost
      - key: QDRANT_HOST
        value: localhost
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: localhost:9092
      - key: OPENAI_API_KEY
        sync: false
  
databases:
  - name: fios-postgres
    plan: free
    postgresMajorVersion: 15
