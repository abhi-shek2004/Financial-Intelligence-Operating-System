services:
  - type: web
    name: fios-api-gateway
    env: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fios-postgres
          property: connectionString
      - key: REDIS_URL
        value: redis://red-xxxxx:6379
      - key: OPENAI_API_KEY
        sync: false # Requires manual entry in the dashboard
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: # Will connect to Confluent Cloud later
  
databases:
  - name: fios-postgres
    plan: standard
    postgresMajorVersion: 15
